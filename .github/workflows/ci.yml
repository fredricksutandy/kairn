name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The architectural guard. packages/sections is hand-designed and no
      # design agent normalises it, so this is the only thing standing between
      # a variant and a hardcoded colour.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Proves the guard still has teeth: the rule unit tests, plus fixtures
      # that must be rejected and a correct section that must pass.
      - name: Lint guard
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # Build order step 3 adds a second job here: the adversarial harness
  # (pinner, bleeder, hog) composed every way and asserted to survive. It is a
  # permanent fixture, not a scaffold — see docs/03-animation-contract.md.
