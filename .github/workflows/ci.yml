name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow writes to the repo. A dependency that runs code at
# install or build time inherits this token, so it gets read and nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The architectural guard. packages/sections is hand-designed and no
      # design agent normalises it, so this is the only thing standing between
      # a variant and a hardcoded colour.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Proves the guard still has teeth: the rule unit tests, plus fixtures
      # that must be rejected and a correct section that must pass.
      - name: Lint guard
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # The adversarial harness: pinner, bleeder and hog composed every way and
  # asserted to survive. A permanent fixture, not a scaffold — when a real
  # variant later breaks, this tells you it is the variant and not the system.
  #
  # Separate from `verify` so a red harness is legible at a glance: this is the
  # job that fails when the orchestrator desyncs.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build renderer
        run: pnpm --filter @kairn/inv build

      - name: Adversarial harness
        run: pnpm run test:harness
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-failures
          path: test-results/
          retention-days: 7
